let history=JSON.parse(localStorage.getItem("katei_history_v2")||"{}");

const $=id=>document.getElementById(id);
function save(){localStorage.setItem("katei_history_v2",JSON.stringify(history));localStorage.setItem("katei_wrong_v2",JSON.stringify([...wrong]));}
function stats(){let solved=Object.keys(history).length, correct=Object.values(history).filter(x=>x===true).length;let mastered=new Set(Object.entries(history).filter(([i,v])=>v).map(([i])=>+i)).size;let pct=Math.round(mastered/qs.length*100);$("meter").style.width=pct+"%";$("meterText").textContent=pct+"%（習得 "+mastered+"/"+qs.length+"）";$("mastered").textContent=mastered;$("total").textContent=qs.length;$("accuracy").textContent=solved?Math.round(correct/solved*100)+"%":"—";}
function current(){return order[pos]}
function render(){let id=current(),q=qs[id];$("qindex").textContent=`問題 ${pos+1} / ${order.length}`;$("qcategory").textContent=q.cat;$("question").textContent=q.q;$("options").innerHTML="";$("feedback").classList.add("hidden");

function feedback(ok,q){$("feedback").classList.remove("hidden");$("feedback").innerHTML=(ok?"<b>正解！</b>":"<b>不正解。</b> 正解："+q.opts[q.a])+"<br>"+q.why}
function answer(j){let id=current(),q=qs[id],ok=j===q.a;history[id]=ok;if(ok)wrong.delete(id);else wrong.add(id);save();[...$("options").children].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("correct");if(k===j&&!ok)b.classList.add("wrong")});feedback(ok,q);stats();renderWrong();}
$("prev").onclick=()=>{pos=Math.max(0,pos-1);render()};$("next").onclick=()=>{if(pos<order.length-1){pos++;render()}else alert("この出題セットは終了！理解度メーターと間違い復習を確認しよう。")};
$("shuffle").onclick=()=>{order.sort(()=>Math.random()-.5);pos=0;render()};
function buildFilters(){let cats=["すべて",...new Set(qs.map(q=>q.cat))];$("categoryFilters").innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.textContent=c;b.className=c===activeCat?"primary":"";b.onclick=()=>{activeCat=c;order=qs.map((q,i)=>i).filter(i=>c==="すべて"||qs[i].cat===c);pos=0;buildFilters();render()};$("categoryFilters").appendChild(b)})}
function renderNotes(filter=""){$("noteList").innerHTML="";notes.filter(n=>(n[0]+n[1]).includes(filter)).forEach(n=>{let d=document.createElement("div");d.className="point";d.innerHTML=`<h3>${n[0]}　<span class="star">★要点</span></h3><p>${n[1]}</p>`;$("noteList").appendChild(d)})}

function renderWrong(){$("wrongList").innerHTML="";let ids=[...wrong].sort((a,b)=>a-b);if(!ids.length){$("wrongList").innerHTML="<p>間違えた問題はありません。クイズに挑戦してみよう。</p>";return}ids.forEach(id=>{let q=qs[id],d=document.createElement("div");d.className="point";d.innerHTML=`<b>${q.cat}</b><p>${q.q}</p><p class="muted">正解：${q.opts[q.a]}</p><button class="btn">この問題に挑戦</button>`;d.querySelector("button").onclick=()=>{activeCat="すべて";order=qs.map((_,i)=>i);pos=order.indexOf(id);document.querySelector('[data-page="quiz"]').click();buildFilters();render()};$("wrongList").appendChild(d)})}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");["quiz","notes","wrong"].forEach(p=>$(p).classList.toggle("hidden",p!==b.dataset.page))});
buildFilters();render();renderNotes();renderWrong();stats();
